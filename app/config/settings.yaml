app:
  name: ai-portrait-gallery
  debug: true

camera:
  index: 0
  backend: auto
  width: 1280
  height: 720
  fps: 30
  buffer_size: 1
  preview_enabled: true
  reconnect_attempts: 5
  reconnect_delay_seconds: 1.5
  reconnect_fail_threshold: 5
  self_test_duration_seconds: 10

trigger:
  minimum_face_size: 110
  stable_detection_frames: 8
  stable_detection_seconds: 1.0
  post_session_cooldown_seconds: 8
  max_faces_allowed: 1
  multi_face_strategy: largest_central

capture:
  burst_count: 5
  burst_interval_seconds: 0.08
  resize_width: 1024
  resize_height: 1024

paths:
  live_capture_dir: input/live_capture
  comfy_input_dir: input/comfy_input
  output_latest_dir: output/latest
  output_archive_dir: output/archive
  logs_dir: logs
  workflows_dir: workflows

comfy:
  base_url: http://127.0.0.1:8188
  input_dir: 'C:\Users\13der\OneDrive\Desktop\GITHUB\VideoArt_Project\input\comfy_input'
  input_folders:
    - 'C:\Users\13der\OneDrive\Desktop\GITHUB\VideoArt_Project\input\comfy_input'
  output_folders:
    - 'C:\Users\13der\OneDrive\Desktop\GITHUB\VideoArt_Project\output\comfy_output'
  fixed_input_filename: input.jpg
  delete_inputs_after_success: true
  inject_input_filename: false
  inject_output_prefix: false
  request_timeout_seconds: 10
  generation_timeout_seconds: 180
  poll_interval_seconds: 2
  output_filename_prefix_pattern: "{session_id}_{workflow}"
  expected_output_count: 5

obs:
  host: ${OBS_HOST}
  port: ${OBS_PORT}
  password: ${OBS_PASSWORD}
  scenes:
    idle: Idle Scene
    capture: Capture Scene
    processing: Processing Scene
    reveal: Reveal Scene
    error: Error Scene
  sources:
    hero_image: Portrait Hero

workflows:
  enabled:
    - mona_lisa
  files:
    mona_lisa: workflows/mona_lisa.json
    american_gothic: workflows/american_gothic.json
    pearl_earring: workflows/pearl_earring.json
    girl_with_hat: workflows/girl_with_hat.json
    pop_art_portrait: workflows/pop_art_portrait.json

display:
  reveal_duration_seconds: 20

storage:
  archive_enabled: true
